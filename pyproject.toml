[project]
name = "async-doctor"
description = "Your agent blocks the event loop. This catches it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
keywords = ["asyncio", "static-analysis", "linter", "event-loop", "blocking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/maolonglong/async-doctor"
Repository = "https://github.com/maolonglong/async-doctor"
Issues = "https://github.com/maolonglong/async-doctor/issues"
Changelog = "https://github.com/maolonglong/async-doctor/releases"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/async_doctor/Cargo.toml"
module-name = "async_doctor"
# Console script name matches [[bin]] name = "async-doctor" in the crate.
strip = true
# rust-toolchain.toml is required so sdist builds pin the same toolchain.
include = [{ path = "rust-toolchain.toml", format = "sdist" }]
exclude = [
    "fixtures/**",
    "target/**",
    "docs/**",
    "bench/**",
    "skills/**",
    ".cursor/**",
    ".github/**",
]

# Defaults for `maturin generate-ci github` (Release workflow is hand-tuned
# on top of this: v* tags only + workflow_dispatch dry-run, environment=pypi).
[tool.maturin.generate-ci.github]
pytest = false
zig = true
skip-attestation = false
trusted-publishing = true
publishing-environment = "pypi"

[tool.maturin.generate-ci.github.linux]
targets = ["x86_64", "aarch64"]

[tool.maturin.generate-ci.github.musllinux]
targets = ["x86_64", "aarch64"]

[tool.maturin.generate-ci.github.macos]
targets = ["x86_64", "aarch64"]

[tool.maturin.generate-ci.github.windows]
targets = ["x86_64"]
