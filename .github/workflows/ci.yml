name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly catch-up for the main-only stress job (also runs on every main push).
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      # Separate key from `test`: GitHub Actions cache entries are write-once, so
      # a shared key lets the faster lint job seal an empty/dev-only cache and
      # the test job can never update it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint
          # TEMP: also save from this PR for warm-cache measurement; revert to
          # main-only before merge. head_ref is set on pull_request.
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'cursor/ci-speed-14fe' }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: rust file length (AGENTS.md <=800)
        run: ./scripts/check_rust_file_length.sh

      - name: check docs
        run: python3 scripts/check_docs.py

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          # TEMP: also save from this PR for warm-cache measurement; revert to
          # main-only before merge.
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'cursor/ci-speed-14fe' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: cargo nextest (PR suite)
        # concurrent_cold_scans* are #[ignore]; main-only `stress` job runs them.
        run: cargo nextest run --workspace --profile ci

      - name: cargo test --doc
        # nextest does not run doctests; keep the step even when the count is 0.
        run: cargo test --workspace --doc

  stress:
    name: stress
    # Heavy concurrent cold-cache trials: every main push, manual, or weekly schedule.
    # Not on pull_request — see docs/notes/2026-10-concurrent-cache-stress.md.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: concurrent cold-cache (N=15/20 CI variants)
        # --run-ignored only + exclude N=100 *_stress tests (local hunting).
        run: >-
          cargo nextest run -p async_doctor --test concurrent_cache
          --profile stress --run-ignored only
          -E 'test(concurrent_cold_scans) and not test(/_stress$/)'
